[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optcar"
version = "0.1.0"
description = "Torch vehicle dynamics data generation, learning, and visualization"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "PyYAML>=6", "scipy>=1.10", "flask>=3", "joblib>=1.4,<2", "rich>=13,<15", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
ros = ["rosbags>=0.11,<0.12"]
bags = ["rosbags>=0.11,<0.12"]
dev = ["pytest>=8"]

[project.scripts]
optcar = "optcar.cli:main"

[tool.setuptools.packages.find]
include = ["optcar*"]

[tool.setuptools.package-data]
"optcar.gui" = ["templates/*.html", "static/*.css", "static/*.js"]

"optcar.gui.dbm_tool" = ["templates/dbm_tool/*.html", "static/*.css", "static/*.js"]
