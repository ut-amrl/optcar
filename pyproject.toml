[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optcar"
version = "0.1.0"
authors = [{name = "Rwik Rana", email = "rwikrana@gmail.com"}]
description = "Torch vehicle dynamics data generation, learning, and visualization"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "PyYAML>=6", "scipy>=1.10", "flask>=3", "joblib>=1.4,<2", "rich>=13,<15", "matplotlib>=3.8,<4", "lightning>=2.5,<3", "tensorboard>=2.18,<3", "tqdm>=4.66,<5", "wandb>=0.19,<1"]

[project.optional-dependencies]
bags = ["rosbags>=0.11,<0.12"]
dev = ["pytest>=8"]

[project.scripts]
optcar = "optcar.cli:main"

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES"]

[tool.setuptools.packages.find]
include = ["optcar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"optcar.gui" = ["templates/*.html", "static/*.css", "static/*.js"]

"optcar.gui.dbm_tool" = ["templates/dbm_tool/*.html", "static/*.css", "static/*.js"]
